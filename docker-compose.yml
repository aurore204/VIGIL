services:
  db:
    image: postgres:16
    container_name: vigil-db
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil_password
      POSTGRES_DB: vigil
    ports:
      - "5433:5432"
    volumes:
      - vigil_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vigil-server
    environment:
      DATABASE_URL: postgres://vigil:vigil_password@db:5432/vigil
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # Construit le binaire desktop (.AppImage) et le dépose dans un volume
  client_desktop:
    build:
      context: .
      dockerfile: client_desktop/Dockerfile
    container_name: vigil-client-desktop
    volumes:
      - vigil_desktop_bin:/output

  # Sert le client web statique ET expose le binaire desktop récupéré depuis le volume partagé avec client_desktop.
  client_web:
    build:
      context: ./client_web
      dockerfile: Dockerfile
    container_name: vigil-client-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    ports:
      - "8081:8081"
    depends_on:
      server:
        condition: service_started
      client_desktop:
        condition: service_completed_successfully
    volumes:
      - vigil_desktop_bin:/desktop-bin:ro

volumes:
  vigil_db_data:
  vigil_desktop_bin: