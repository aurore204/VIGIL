name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vigil
          POSTGRES_PASSWORD: vigil_password
          POSTGRES_DB: vigil
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vigil:vigil_password@localhost:5432/vigil
      JWT_SECRET: ci_secret_key
      TOKEN_ENCRYPTION_KEY: ci_encryption_key_32_characters!
      SQLX_OFFLINE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            server/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config build-essential

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features native-tls,postgres --force

      - name: Wait for Postgres
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U vigil && break
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run migrations
        working-directory: server
        run: sqlx migrate run

      - name: Build
        working-directory: server
        run: cargo build

      - name: Lint (Clippy)
        working-directory: server
        run: cargo clippy -- -D warnings

      - name: Format check
        working-directory: server
        run: cargo fmt --check

      - name: Run tests
        working-directory: server
        run: cargo test

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client_web/package-lock.json

      - name: Install dependencies
        working-directory: client_web
        run: npm ci

      - name: Lint (ESLint)
        working-directory: client_web
        run: npx eslint .

      - name: Format check (Prettier)
        working-directory: client_web
        run: npx prettier --check .

      - name: Run unit tests
        working-directory: client_web
        run: npm test -- --ci

  coverage-backend:
    name: Backend coverage (main only)
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vigil
          POSTGRES_PASSWORD: vigil_password
          POSTGRES_DB: vigil
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vigil:vigil_password@localhost:5432/vigil
      JWT_SECRET: ci_secret_key
      TOKEN_ENCRYPTION_KEY: ci_encryption_key_32_characters!
      SQLX_OFFLINE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config build-essential

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features native-tls,postgres --force

      - name: Wait for Postgres
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U vigil && break
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run migrations
        working-directory: server
        run: sqlx migrate run

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --force

      - name: Run coverage
        working-directory: server
        run: cargo tarpaulin --out Html --out Xml --output-dir ../coverage-backend

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage-backend/

  coverage-frontend:
    name: Frontend coverage (main only)
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client_web/package-lock.json

      - name: Install dependencies
        working-directory: client_web
        run: npm ci

      - name: Run coverage
        working-directory: client_web
        run: npm run test:coverage -- --ci

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: client_web/coverage/